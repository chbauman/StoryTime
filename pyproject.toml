[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "story-time"
dynamic = ["version"]
description = "Digital Diary written in wxPython"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christian Baumann", email = "chris.python.notifyer@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "wxPython>=4.2",
    "opencv-python>=4.5",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "build",
    "twine",
    "keyring",
]

[project.urls]
Homepage = "https://github.com/chbauman/StoryTime"

[project.scripts]
story-time = "story_time.main:main"

[tool.setuptools.packages.find]
include = ["story_time*"]

[tool.setuptools.package-data]
story_time = ["Icons/*", "locales/*.json"]

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.ruff]
line-length = 90
target-version = "py39"
extend-exclude = ["docs/sphinx"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["wx.Colour"]
