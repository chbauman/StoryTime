name: Release

# Makes a GitHub release when a tag like v1.2.3 is pushed. The tag has to match
# `version.txt` and the changelog needs a section for the version. Publishing to
# PyPI is not done here, see "Releasing" in the README.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag is the version of the package
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "The tag ${GITHUB_REF_NAME} is not v${version} (version.txt)"
            exit 1
          }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: The notes of the version
        run: python tools/changelog_notes.py "${VERSION}" | tee notes.md
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "StoryTime ${VERSION}" --notes-file notes.md
