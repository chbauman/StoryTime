name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Style and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff black mypy
      - run: ruff check .
      - run: black --check .
      - run: mypy

  logic:
    # The logic does not need wx, so these tests run without a GUI and without
    # wxPython being installed, on all supported Python versions.
    name: Logic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pytest
      - name: Run the tests that do not use wx
        run: >
          python -m pytest -q
          tests/test_controller.py
          tests/test_dates.py
          tests/test_folders.py
          tests/test_images.py
          tests/test_pure_modules.py
          tests/test_settings.py
          tests/test_shortcuts.py
          tests/test_texts.py
          tests/test_xml.py

  gui:
    name: All tests with the GUI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the libraries of wxPython and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libsdl2-2.0-0 libnotify4 libxtst6 fonts-dejavu-core
      - name: Install the Python packages
        # PyPI has no wheel of wxPython for Linux, only the source, which takes very
        # long to build. Take the wheel built for this version of Ubuntu instead.
        run: |
          pip install --only-binary=wxPython \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 \
            wxPython opencv-python-headless pytest
      - name: Run all tests
        run: xvfb-run -a python -m pytest -q -o faulthandler_timeout=120

  build:
    name: Build the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The package has the icons, the texts and the modules
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          cat files.txt
          grep -q "story_time/Icons/save_icon.png" files.txt
          grep -q "story_time/locales/en.json" files.txt
          grep -q "story_time/controller.py" files.txt
